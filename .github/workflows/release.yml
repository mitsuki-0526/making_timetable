name: Release Tauri Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $confPath = "src-tauri/tauri.conf.json"
          $json = Get-Content $confPath -Raw | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 32 | Set-Content -Encoding utf8 $confPath
          Write-Host "tauri.conf.json version set to $version"

      - name: Build Tauri installer (signed)
        shell: pwsh
        env:
          KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $key = $env:KEY_SECRET
          # UTF-8 BOM (U+FEFF) を文字レベルで除去
          if ($key.Length -gt 0 -and [int][char]$key[0] -eq 0xFEFF) {
            $key = $key.Substring(1)
          }
          $key = $key.Trim()
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          Write-Host "Key length: $($key.Length)"
          Write-Host "Key starts with: $($key.Substring(0, [Math]::Min(20, $key.Length)))"
          pnpm exec tauri build

      - name: Collect release assets and generate latest.json
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $repoUrl = "https://github.com/mitsuki-0526/making_timetable-releases"

          Write-Host "=== bundle/nsis contents ==="
          Get-ChildItem $bundleDir

          # Tauri 2 NSIS は .exe に直接署名する (.nsis.zip は生成しない)
          $exeFile = Get-ChildItem $bundleDir -Filter "*-setup.exe" | Select-Object -First 1
          $sigFile = Get-ChildItem $bundleDir -Filter "*-setup.exe.sig" | Select-Object -First 1

          if ($sigFile -and $exeFile) {
            # ユーザー向けにわかりやすいファイル名にリネームしてコピー
            $friendlyName = "makingtimetable_$tag`_setup.exe"
            Copy-Item $exeFile.FullName "release-assets/$friendlyName" -Force
            Write-Host "Staged exe: $friendlyName"

            $signature = (Get-Content $sigFile.FullName -Raw).Trim()
            $downloadUrl = "$repoUrl/releases/download/$tag/$friendlyName"
            $latestJson = [ordered]@{
              version  = $version
              notes    = ""
              pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = $signature
                  url       = $downloadUrl
                }
              }
            } | ConvertTo-Json -Depth 10
            $latestJson | Set-Content -Encoding utf8 "release-assets/latest.json"
            Write-Host "Generated latest.json -> $downloadUrl"
          } else {
            Write-Error "Cannot generate latest.json: .exe or .exe.sig not found"
            exit 1
          }

          Write-Host "=== release-assets ==="
          Get-ChildItem release-assets

      - name: Publish to releases repository
        uses: softprops/action-gh-release@v2
        with:
          repository: mitsuki-0526/making_timetable-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
